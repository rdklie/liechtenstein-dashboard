<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="120" height="100" role="img" aria-label="Kraki, die Datenkrake" class="kk">
<style>
.kk .kk-sway{transform-box:fill-box;transform-origin:50% 0;animation:kk-sw 2.4s ease-in-out infinite alternate}
.kk .kk-d2{animation-delay:-.6s}.kk .kk-d3{animation-delay:-1.2s}.kk .kk-d4{animation-delay:-1.8s}
@keyframes kk-sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.kk .kk-think,.kk .kk-sleep{display:none}
.kk.kk-thinking .kk-idle,.kk.kk-sleeping .kk-idle{display:none}
.kk.kk-thinking .kk-think{display:inline}
.kk.kk-sleeping .kk-sleep{display:inline}
.kk.kk-sleeping .kk-sway{animation:none}
.kk.kk-thinking .kk-sway{animation-duration:1.1s}
@media (prefers-reduced-motion:reduce){.kk .kk-sway{animation:none!important}}
</style>
