databases:
  - name: liechtenstein-db
    plan: free
    databaseName: liechtenstein
    user: liechtenstein

services:
  # ── Web Service (Dash Dashboard) ────────────────────────────────────────────
  - type: web
    name: liechtenstein-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liechtenstein-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Cron Job (täglicher Datenfetcher) ───────────────────────────────────────
  - type: cron
    name: liechtenstein-fetcher
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    schedule: "0 6 * * *"   # täglich um 06:00 UTC
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liechtenstein-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
